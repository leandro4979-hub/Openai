name: Nexus Omni Generate

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Image prompt to send to FAL
        required: true
        type: string
      seed:
        description: Optional whole-number seed for reproducible output
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate image with FAL
        id: generation
        uses: ./
        with:
          fal_key: ${{ secrets.FAL_KEY }}
          prompt: ${{ inputs.prompt }}
          seed: ${{ inputs.seed }}

      - name: Add image to workflow summary
        env:
          IMAGE_URL: ${{ steps.generation.outputs.image_url }}
        run: |
          echo "## Nexus Omni result" >> "$GITHUB_STEP_SUMMARY"
          echo "![Generated image]($IMAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the generated image]($IMAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
