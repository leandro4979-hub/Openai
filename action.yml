name: Nexus Omni Generate
description: Generate an image from a prompt with FAL
author: Leandro Fajardo
branding:
  icon: image
  color: purple
inputs:
  fal_key:
    description: FAL API key
    required: true
  prompt:
    description: Image prompt
    required: true
  subject_id:
    description: Optional stable numeric seed
    required: false
    default: ""
outputs:
  image_url:
    description: Generated image URL
runs:
  using: node20
  main: index.js
