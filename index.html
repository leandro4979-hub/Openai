<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdBlock AI Hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background:#000; color:#0ff; font-family:'Courier New', monospace; display:flex; flex-direction:column; min-height:100vh; margin:0; }
    #header-container { text-align:center; padding:10px 0; }
    .glitch { text-shadow:2px 0 #f0f,-2px 0 #0ff; animation:scan 2s infinite; font-weight:bold; }
    @keyframes scan { 0%{opacity:1} 50%{opacity:.8} 100%{opacity:1} }
    .tabs { display:flex; justify-content:center; gap:15px; margin-bottom:10px; flex-wrap:wrap; }
    .tabs button { background:#111; color:#0ff; border:1px solid #0ff; padding:8px 16px; cursor:pointer; font-weight:bold; }
    .tabs button.active { background:#0ff; color:#000; box-shadow:0 0 10px #0ff; }
    #chat { flex:1; overflow-y:auto; padding:20px; border:2px solid #0ff; box-shadow:inset 0 0 10px #0ff; margin:10px; background:#000; min-height:280px; }
    #input-area { padding:20px; display:flex; gap:10px; }
    input { flex:1; background:#111; border:1px solid #0ff; color:#0ff; padding:10px; outline:none; }
    .run-btn { background:#0ff; color:#000; border:none; padding:10px 20px; cursor:pointer; font-weight:bold; text-transform:uppercase; }
    .run-btn:disabled { opacity:.5; cursor:not-allowed; }
    #media-output { margin:10px 20px; display:none; }
    .neon-box { border:2px solid #0ff; box-shadow:0 0 20px #0ff,inset 0 0 10px #0ff; border-radius:12px; background:#000; max-height:400px; object-fit:contain; }
    pre, code { background:#111; display:block; padding:10px; border:1px dashed #f0f; color:#fff; cursor:pointer; margin:5px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .log-error { color:#f66; }
    .log-ok { color:#0f0; }
    .log-ai { color:#f0f; white-space:pre-wrap; }
    .log-info { color:#0ff; }
  </style>
</head>
<body>
  <div id="header-container">
    <h2 class="glitch">⚡ ADBLOCK AI HUB ⚡</h2>
    <div class="tabs">
      <button id="tab-chat" class="active" type="button">CHAT</button>
      <button id="tab-image" type="button">IMAGE</button>
      <button id="tab-video" type="button">VIDEO</button>
    </div>
  </div>

  <div id="chat" aria-live="polite">Welcome, Leandro. System ready...</div>

  <div id="media-output">
    <img id="res-img" class="neon-box" alt="Generated result" style="display:none;width:100%;">
    <video id="res-vid" class="neon-box" style="display:none;width:100%;" controls></video>
  </div>

  <div id="input-area">
    <input type="text" id="prompt" placeholder="Request script, filter, image prompt, or video prompt..." autocomplete="off">
    <button id="run-btn" class="run-btn" type="button">RUN</button>
  </div>

  <script>
    let currentMode = 'chat';

    const chatWindow = document.getElementById('chat');
    const promptInput = document.getElementById('prompt');
    const runButton = document.getElementById('run-btn');
    const mediaOutput = document.getElementById('media-output');
    const imgEl = document.getElementById('res-img');
    const vidEl = document.getElementById('res-vid');

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('prompt')) promptInput.value = urlParams.get('prompt');

    function appendLog(message, className = '') {
      const p = document.createElement('p');
      if (className) p.className = className;
      p.textContent = message;
      chatWindow.appendChild(p);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return p;
    }

    function appendAIMessage(message) {
      const p = document.createElement('p');
      p.className = 'log-ai';
      p.textContent = message;
      chatWindow.appendChild(p);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function setMode(mode) {
      currentMode = mode;
      for (const candidate of ['chat', 'image', 'video']) {
        document.getElementById(`tab-${candidate}`).classList.toggle('active', candidate === mode);
      }
      mediaOutput.style.display = mode === 'chat' ? 'none' : 'block';
      imgEl.style.display = 'none';
      vidEl.style.display = 'none';
    }

    document.getElementById('tab-chat').addEventListener('click', () => setMode('chat'));
    document.getElementById('tab-image').addEventListener('click', () => setMode('image'));
    document.getElementById('tab-video').addEventListener('click', () => setMode('video'));

    // Event delegation survives future DOM additions and avoids losing handlers when logs change.
    chatWindow.addEventListener('click', async (event) => {
      const block = event.target.closest('pre, code');
      if (!block || !chatWindow.contains(block)) return;
      try {
        await navigator.clipboard.writeText(block.innerText);
        appendLog('> Status: Code block copied to clipboard.', 'log-ok');
      } catch (error) {
        appendLog(`> Clipboard error: ${error.message}`, 'log-error');
      }
    });

    function extractMediaUrl(data, mode) {
      const output = data?.output ?? data;
      if (mode === 'video') {
        return output?.video?.url || output?.video_url || output?.url || output?.data?.video?.url || null;
      }
      return output?.images?.[0]?.url || output?.image?.url || output?.image_url || output?.url || output?.data?.images?.[0]?.url || null;
    }

    async function requestJSON(url, options) {
      const response = await fetch(url, options);
      const text = await response.text();
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        throw new Error(`Server returned invalid JSON (${response.status}).`);
      }

      if (!response.ok) {
        const detail = data?.error?.message || data?.error || data?.message || `HTTP ${response.status}`;
        throw new Error(String(detail));
      }
      return data;
    }

    async function send() {
      const userPrompt = promptInput.value.trim();
      if (!userPrompt) return;

      runButton.disabled = true;
      appendLog(`> [${currentMode.toUpperCase()}] ${userPrompt}`);

      try {
        if (currentMode === 'chat') {
          const data = await requestJSON('/api/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'gpt-5.2',
              messages: [{ role: 'user', content: userPrompt }]
            })
          });

          const answer = data?.choices?.[0]?.message?.content;
          if (!answer) throw new Error('Chat API response did not contain choices[0].message.content.');
          appendAIMessage(answer);
        } else {
          imgEl.style.display = 'none';
          vidEl.style.display = 'none';
          appendLog('> Sending generation request to backend...', 'log-info');

          // The UI calls a same-origin backend and never exposes provider API keys in the browser.
          // If the route is not deployed, the resulting HTTP error is surfaced to the user.
          const endpoint = currentMode === 'video' ? '/api/fal/seedance' : '/api/fal/image';
          const payload = currentMode === 'video'
            ? { prompt: userPrompt, generate_audio: true, resolution: '1080p' }
            : { prompt: userPrompt };

          const data = await requestJSON(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const mediaUrl = extractMediaUrl(data, currentMode);
          if (!mediaUrl) throw new Error('Generation backend succeeded but returned no usable media URL.');

          if (currentMode === 'video') {
            vidEl.src = mediaUrl;
            vidEl.style.display = 'block';
          } else {
            imgEl.src = mediaUrl;
            imgEl.style.display = 'block';
          }
          appendLog('> Generation complete.', 'log-ok');
        }

        promptInput.value = '';
      } catch (error) {
        appendLog(`> Request failed: ${error.message}`, 'log-error');
      } finally {
        runButton.disabled = false;
        promptInput.focus();
      }
    }

    runButton.addEventListener('click', send);
    promptInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') send();
    });
  </script>
</body>
</html>
