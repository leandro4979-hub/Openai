<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdBlock AI Hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: "Courier New", monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      border: 2px solid #0ff;
      box-shadow: inset 0 0 10px #0ff;
      margin: 10px;
      white-space: pre-wrap;
    }

    #input-area {
      padding: 20px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      background: #111;
      border: 1px solid #0ff;
      color: #0ff;
      padding: 10px;
      outline: none;
    }

    button {
      background: #0ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .assistant-message {
      color: #f0f;
    }

    .error-message {
      color: #ff6b6b;
    }

    .system-message {
      color: #aaa;
    }

    pre,
    code {
      cursor: copy;
    }

    .glitch {
      text-shadow: 2px 0 #f0f, -2px 0 #0ff;
      animation: scan 2s infinite;
    }

    @keyframes scan {
      0% { opacity: 1; }
      50% { opacity: 0.8; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h2 class="glitch" style="text-align:center;">⚡ ADBLOCK AI HUB ⚡</h2>
  <div id="chat" aria-live="polite">Welcome, Leandro. System ready...</div>
  <div id="input-area">
    <input type="text" id="prompt" placeholder="Request script or filter..." autocomplete="off">
    <button id="run-button" type="button">RUN</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const promptInput = document.getElementById("prompt");
    const runButton = document.getElementById("run-button");

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("prompt")) {
      promptInput.value = urlParams.get("prompt") || "";
    }

    function appendMessage(text, className = "") {
      const paragraph = document.createElement("p");
      paragraph.textContent = text;
      if (className) paragraph.className = className;
      chat.appendChild(paragraph);
      chat.scrollTop = chat.scrollHeight;
      return paragraph;
    }

    function appendAssistantContent(text) {
      const container = document.createElement("div");
      container.className = "assistant-message";

      const parts = String(text).split(/```/);
      parts.forEach((part, index) => {
        if (!part) return;

        if (index % 2 === 1) {
          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.textContent = part.replace(/^\w+\n/, "");
          code.title = "Click to copy";
          pre.appendChild(code);
          container.appendChild(pre);
        } else {
          const paragraph = document.createElement("p");
          paragraph.textContent = part;
          container.appendChild(paragraph);
        }
      });

      chat.appendChild(container);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const prompt = promptInput.value.trim();
      if (!prompt || runButton.disabled) return;

      appendMessage(`> ${prompt}`);
      runButton.disabled = true;
      promptInput.disabled = true;

      try {
        const response = await fetch("/api/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "gpt-5.2",
            messages: [{ role: "user", content: prompt }]
          })
        });

        const rawBody = await response.text();
        let data;

        try {
          data = rawBody ? JSON.parse(rawBody) : {};
        } catch {
          throw new Error(`Chat API returned invalid JSON (HTTP ${response.status}).`);
        }

        if (!response.ok) {
          const detail = data?.error?.message || data?.error || rawBody || response.statusText;
          throw new Error(`Chat API failed with HTTP ${response.status}: ${detail}`);
        }

        const content = data?.choices?.[0]?.message?.content;
        if (typeof content !== "string" || !content.trim()) {
          throw new Error("Chat API response did not include choices[0].message.content.");
        }

        appendAssistantContent(content);
        promptInput.value = "";
      } catch (error) {
        const message = error instanceof Error ? error.message : "Unknown request failure";
        appendMessage(`Request failed: ${message}`, "error-message");
      } finally {
        runButton.disabled = false;
        promptInput.disabled = false;
        promptInput.focus();
      }
    }

    runButton.addEventListener("click", send);
    promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") send();
    });

    // Event delegation keeps copy behavior working even as new code blocks are appended.
    chat.addEventListener("click", async (event) => {
      const codeBlock = event.target.closest("pre, code");
      if (!codeBlock || !chat.contains(codeBlock)) return;

      const text = codeBlock.innerText || codeBlock.textContent || "";
      if (!text.trim()) return;

      try {
        await navigator.clipboard.writeText(text);
        appendMessage("Code copied to clipboard.", "system-message");
      } catch {
        appendMessage("Could not copy code to the clipboard.", "error-message");
      }
    });
  </script>
</body>
</html>
